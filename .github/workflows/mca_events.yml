name: MCA Events

on:
  schedule:
    # Runs twice daily at 08:00 and 20:00 UTC (1:00 AM & 1:00 PM PDT / UTC-7)
    - cron: '0 8,20 * * *'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  fetch-events:
    runs-on: ubuntu-latest

    # Needed so the bot can commit the refreshed JSON back to the repo.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch MCA events (current month + featured)
        run: python tools/fetch_mca_events.py --months 1 --featured -o data/mca_events.json

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # "|| exit 0" keeps the workflow green when the events haven't changed.
          git commit -m "Update MCA events: $(date -u)" || exit 0
          # Other scheduled workflows in this repo can push to main around the same
          # time, so retry with a rebase if our push is rejected as non-fast-forward.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded."
              break
            fi
            echo "Push rejected (attempt $i/5) - fetching and rebasing onto origin/main..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict - aborting this run's push; the next scheduled run will pick it up."
              git rebase --abort
              exit 0
            fi
            sleep $((RANDOM % 5 + 1))
          done
