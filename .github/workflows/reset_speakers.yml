name: Reset Speakers

on:
  schedule:
    # Runs at 05:00 UTC Saturday (10:00 PM Friday PDT / UTC-7)
    - cron: '0 5 * * 6'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  reset:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reset speakers
        run: python reset_speakers.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Reset speakers: $(date)" || exit 0
          # Other scheduled workflows in this repo can push to main around the same
          # time, so retry with a rebase if our push is rejected as non-fast-forward.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded."
              break
            fi
            echo "Push rejected (attempt $i/5) - fetching and rebasing onto origin/main..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict - aborting this run's push; the next scheduled run will pick it up."
              git rebase --abort
              exit 0
            fi
            sleep $((RANDOM % 5 + 1))
          done
